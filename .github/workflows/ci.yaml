name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions ros-jazzy-xacro ros-jazzy-ament-cmake-pytest
      - name: Build and test
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          colcon test
          colcon test-result --verbose
